services:
  agendador:
    build: .
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:${AGENDADOR_HOST_PORT:-3020}:3020"
    environment:
      GOOGLE_CALENDAR_CLIENT_ID: ${GOOGLE_CALENDAR_CLIENT_ID:-}
      GOOGLE_CALENDAR_CLIENT_SECRET: ${GOOGLE_CALENDAR_CLIENT_SECRET:-}
      GOOGLE_CALENDAR_REDIRECT_URI: ${GOOGLE_CALENDAR_REDIRECT_URI:-}
      META_PIXEL_ID: ${META_PIXEL_ID:-}
      META_CONVERSIONS_ACCESS_TOKEN: ${META_CONVERSIONS_ACCESS_TOKEN:-}
      META_TEST_EVENT_CODE: ${META_TEST_EVENT_CODE:-}
    volumes:
      - agendador-data:/app/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  agendador-data:
